# Reverse-proxy Apache : https://francoislamalle.fr/hub → Node (Next.js)
#
# Prérequis modules : proxy, proxy_http, headers (souvent déjà actifs)
#   sudo a2enmod proxy proxy_http headers rewrite
#
# Inclure depuis le VirtualHost HTTPS du domaine, par ex. :
#   IncludeOptional /var/www/homehub/deploy/apache-hub.conf
# ou copier le bloc dans le conf du site.

# Ne pas laisser Apache servir un dossier FTP /hub ou /homehub en listing.
# Le proxy doit prendre le dessus sur tout DocumentRoot local.

<Location /hub>
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Prefix "/hub"

  ProxyPass        http://127.0.0.1:3000/hub
  ProxyPassReverse http://127.0.0.1:3000/hub
</Location>

# Assets Next (_next) sous le basePath
<Location /hub/_next>
  ProxyPass        http://127.0.0.1:3000/hub/_next
  ProxyPassReverse http://127.0.0.1:3000/hub/_next
</Location>
